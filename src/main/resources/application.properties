spring.application.name=ReservasUnimag

# --- Tiempo: todas las reglas están en hora de Bogotá y las fechas se guardan como timestamptz
spring.jackson.time-zone=America/Bogota
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Persistencia: el esquema lo escribe Flyway; Hibernate solo lo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Negocio
reservations.page-size=20
# Cupo de reservas vigentes por persona, único para espacios y activos (UC2 FR-008)
reservations.max-quota=3
# Máximo continuo de una franja de espacio (UC2 FR-009)
reservations.max-space-duration=2h
# Antelación mínima para que el titular cancele, contra el inicio o la hora de recogida (UC4 FR-007)
reservations.min-cancellation-notice=10m
# Desde cuándo se admite un reporte de no asistencia, contado desde el inicio o la recogida (UC9 FR-011)
reservations.no-show-grace=10m
# Festivos que no consumen plazo de préstamo (UC2 FR-014), además de sábados y domingos.
# Solo los fijos de 2026: los que se trasladan a lunes (Emiliani) hay que completarlos.
reservations.holidays=2026-01-01,2026-05-01,2026-07-20,2026-08-07,2026-12-08,2026-12-25
# Paso con el que se busca la siguiente franja libre cuando ningún recurso es seleccionable (UC1 escenario 7)
reservations.next-slot-step=30m
# Tipos que muestra el filtro mientras el Módulo 1 no publique su lista (P-16)
reservations.resource-types=SALON,LABORATORIO,SALA_DE_ESTUDIO,AUDITORIO,LIBRO,MICROSCOPIO,VIDEOBEAM,PORTATIL

# --- Módulo 1: inventario. Sin autenticación entre módulos
reservations.module1.base-url=${MODULE1_BASE_URL:http://localhost:8081}
reservations.module1.timeout=5s
reservations.module1.page-size=100
reservations.module1.max-pages=50

# --- Módulo 3: cumplimiento y sanciones. Sin autenticación entre módulos
reservations.module3.base-url=${MODULE3_BASE_URL:http://localhost:8083}
reservations.module3.timeout=3s

# --- Sesión del frontend: JWT propio en cookie httpOnly
reservations.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-any-shared-env}
reservations.jwt.issuer=reservas-unimag
reservations.jwt.ttl=8h
reservations.jwt.cookie-name=session
reservations.jwt.cookie-secure=true

# --- Mensajería: Kafka detrás de la outbox. Si el broker cae, reservar sigue funcionando
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Que un broker caído no deje colgado al publicador: falla rápido y la outbox reintenta
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000

reservations.kafka.topic.record=module2.reservation.record.v1
reservations.kafka.topic.cancellation=module2.reservation.cancellation.v1
reservations.kafka.topic.no-show-ack=module2.reservation.no-show-ack.v1
# Lo que consumimos del Módulo 3
reservations.kafka.topic.no-show=module3.reservation.no-show.v1

# Consumidor: el offset se confirma por registro cuando el listener termina, es decir después del commit de su
# transacción. Concurrencia igual a las particiones del topic, para no perder el orden por reserva.
spring.kafka.consumer.group-id=module2-reservations
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3

reservations.outbox.enabled=true
reservations.outbox.interval=5s
reservations.outbox.batch=50
reservations.outbox.max-attempts=10
# Un pendiente más viejo que esto se advierte en el log, antes de incumplir los 30 minutos de UC11 SC-005
reservations.outbox.alert-after=25m
