# Perfil prod: el despliegue real. Lo activa el Dockerfile (SPRING_PROFILES_ACTIVE=prod).
# Todo lo que cambia entre entornos o es secreto llega por variables de entorno. Las que no tienen valor por
# defecto son obligatorias: si falta una, la aplicación no arranca, en vez de arrancar con un valor de desarrollo.
#
#   DB_URL, DB_USERNAME, DB_PASSWORD   PostgreSQL (jdbc:postgresql://host:5432/reservasunimag)
#   JWT_SECRET                         al menos 32 caracteres; por ejemplo: openssl rand -base64 48
#   KAFKA_BOOTSTRAP_SERVERS            el broker lo alojamos nosotros, en la misma VM
#   MODULE1_BASE_URL, MODULE3_BASE_URL las APIs REST de los otros módulos
# Opcional:
#   SWAGGER_ENABLED                    true para publicar /swagger-ui (por defecto apagado)

# --- Persistencia
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
# Solo las migraciones: los usuarios de prueba de db/local no pueden llegar a producción
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# --- Sesión: sin valor por defecto, para que nunca se firme con el secreto de desarrollo
reservations.jwt.secret=${JWT_SECRET}
reservations.jwt.cookie-secure=true

# --- Integraciones: sin localhost por defecto
reservations.module1.base-url=${MODULE1_BASE_URL}
reservations.module3.base-url=${MODULE3_BASE_URL}

# --- Kafka. El broker es nuestro y los Módulos 1 y 3 se conectan a él, sin autenticación (como entre módulos
# por REST); ver plan-arquitectura.md, Despliegue
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# --- Servidor: va detrás de un proxy con HTTPS (Caddy en la VM y el rewrite de Next.js en Vercel)
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-stacktrace=never
server.error.include-message=never

# --- Documentación de la API: apagada salvo que se pida
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
